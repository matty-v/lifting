<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="plateGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="512" height="512" rx="64" fill="#0a0e14"/>

  <!-- Barbell glow layer (behind) -->
  <g fill="rgba(255,255,255,0.1)" stroke="none">
    <!-- Bar glow -->
    <rect x="90" y="248" width="332" height="16" rx="8"/>
    <!-- Left inner plate glow -->
    <rect x="108" y="172" width="48" height="168" rx="8"/>
    <!-- Left outer plate glow -->
    <rect x="68" y="196" width="40" height="120" rx="8"/>
    <!-- Right inner plate glow -->
    <rect x="356" y="172" width="48" height="168" rx="8"/>
    <!-- Right outer plate glow -->
    <rect x="404" y="196" width="40" height="120" rx="8"/>
  </g>

  <!-- Barbell main layer -->
  <!-- Center bar - solid indigo -->
  <rect x="96" y="250" width="320" height="12" rx="6" fill="#6366f1"/>

  <!-- Weight plates - filled with gradient -->
  <rect x="112" y="176" width="40" height="160" rx="6" fill="url(#plateGradient)"/>
  <rect x="72" y="200" width="32" height="112" rx="6" fill="url(#plateGradient)"/>
  <rect x="360" y="176" width="40" height="160" rx="6" fill="url(#plateGradient)"/>
  <rect x="408" y="200" width="32" height="112" rx="6" fill="url(#plateGradient)"/>
</svg>
