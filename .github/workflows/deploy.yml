name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to GCS
        run: |
          # Upload index.html (no cache)
          gsutil -h "Content-Type:text/html" \
                 -h "Cache-Control:no-cache, max-age=0" \
                 cp dist/index.html "gs://lifting-tracker/"

          # Upload JS/CSS assets (long cache - they have content hashes)
          gsutil -h "Cache-Control:public, max-age=31536000" \
                 -m cp -r dist/assets "gs://lifting-tracker/"

          # Upload manifest
          if [ -f "dist/manifest.webmanifest" ]; then
            gsutil -h "Content-Type:application/manifest+json" \
                   -h "Cache-Control:no-cache, max-age=0" \
                   cp dist/manifest.webmanifest "gs://lifting-tracker/"
          fi

          # Upload service worker
          if [ -f "dist/sw.js" ]; then
            gsutil -h "Content-Type:application/javascript" \
                   -h "Cache-Control:no-cache, max-age=0" \
                   cp dist/sw.js "gs://lifting-tracker/"
          fi

          # Upload icons
          if [ -d "dist/icons" ]; then
            gsutil -h "Content-Type:image/png" \
                   -h "Cache-Control:public, max-age=31536000" \
                   -m cp -r dist/icons "gs://lifting-tracker/"
          fi
